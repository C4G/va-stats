# Local MySQL instance for testing schema migrations against a staging dump.
# The database is intentionally exposed on 3307 so it does not collide with a
# MySQL server already running on the host.
services:
  va-stats-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:-vastats}
      MYSQL_USER: ${LOCAL_MYSQL_USER:-vastats}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-vastats-local-password}
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:-root-local-password}
    ports:
      - "${LOCAL_MYSQL_PORT:-3307}:3306"
    volumes:
      - va-stats-local-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  va-stats-local-db:
